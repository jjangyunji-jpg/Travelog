# 전 세계 다이빙 포인트·다이빙샵 데이터 파일을 OpenStreetMap에서 새로 받아 저장
# + OpenStreetMap에 포인트가 없는 지역은 AI(OpenAI)로 채우고 지도 검색으로 위치 확인
# 매달 1일 자동 실행 + Actions 탭에서 수동 실행(Run workflow) 가능
name: Update dive sites dataset

on:
  workflow_dispatch:
    inputs:
      skip_osm:
        description: 'OpenStreetMap 받기는 건너뛰고 AI 채우기만 실행'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: dive-sites
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download dive sites from OpenStreetMap
        if: ${{ !inputs.skip_osm }}
        run: node scripts/build-dive-sites.mjs
      - name: Commit if changed
        run: |
          git config user.name "travelog-bot"
          git config user.email "travelog-bot@users.noreply.github.com"
          git add public/dive-sites
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "다이빙 포인트 데이터 갱신 ($(date -u +%Y-%m-%d))"
            # 실행 중에 main에 다른 커밋이 올라왔어도 합쳐서 올리기
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # OpenStreetMap에 없는 포인트를 AI로 채우기 (Settings → Secrets 에 OPENAI_API_KEY 가 있을 때만)
  enrich:
    needs: update
    if: ${{ always() && needs.update.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fill missing dive sites with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/enrich-dive-sites.mjs
      - name: Commit if changed
        run: |
          git config user.name "travelog-bot"
          git config user.email "travelog-bot@users.noreply.github.com"
          git add public/dive-sites
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "AI 다이빙 포인트 채우기 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
